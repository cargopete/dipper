[package]
name = "balerion-tpb"
description = "apibay search client for balerion: a query in, magnet links out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# Same feature set as balerion-ia, and for the same reason: rustls so the binary
# does not go looking for OpenSSL on someone else's machine.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "deflate",
    "gzip",
    "http2",
    "json",
    "rustls",
    "rustls-native-certs",
] }
urlencoding = "2"
html-escape = "0.2.15"
