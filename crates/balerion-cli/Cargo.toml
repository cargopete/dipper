[package]
name = "balerion-cli"
description = "balerion: a single-binary BitTorrent client that finds things as well as fetching them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "balerion"
path = "src/main.rs"

[dependencies]
balerion-bt.workspace = true
balerion-ia.workspace = true
balerion-index.workspace = true
balerion-web.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
indicatif = "0.18"

[dev-dependencies]
tempfile = "3"
sha1 = "0.11"
