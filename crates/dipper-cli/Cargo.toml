[package]
name = "dipper-cli"
description = "dipper: a single-binary BitTorrent client with the Internet Archive as its search backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dipper"
path = "src/main.rs"

[dependencies]
dipper-bt.workspace = true
dipper-ia.workspace = true
dipper-index.workspace = true
dipper-web.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
indicatif = "0.18"

[dev-dependencies]
tempfile = "3"
sha1 = "0.11"
