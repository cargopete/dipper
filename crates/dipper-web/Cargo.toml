[package]
name = "dipper-web"
description = "Local web UI for dipper: paste a magnet, watch the video while it downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dipper-bt.workspace = true
dipper-ia.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "fs", "signal", "process"] }
tracing.workspace = true

axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "query",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
directories = "6"

[dev-dependencies]
tempfile = "3"
sha1 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
