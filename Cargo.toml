[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cargopete/dipper"
rust-version = "1.85"

[workspace.dependencies]
dipper-bt = { path = "crates/dipper-bt", version = "0.1.0" }
dipper-ia = { path = "crates/dipper-ia", version = "0.1.0" }
dipper-index = { path = "crates/dipper-index", version = "0.1.0" }
dipper-web = { path = "crates/dipper-web", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
