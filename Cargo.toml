[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cargopete/balerin"
rust-version = "1.85"

[workspace.dependencies]
balerin-bt = { path = "crates/balerin-bt", version = "0.1.0" }
balerin-ia = { path = "crates/balerin-ia", version = "0.1.0" }
balerin-index = { path = "crates/balerin-index", version = "0.1.0" }
balerin-tpb = { path = "crates/balerin-tpb", version = "0.1.0" }
balerin-web = { path = "crates/balerin-web", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
